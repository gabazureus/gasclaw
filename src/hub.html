<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<title>gasclaw · panels</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; background: #f7f7f5; color: #1d1d1b; }
  main { max-width: 34rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.3rem; }
  ul { list-style: none; padding: 0; }
  li { border-bottom: 1px solid #e5e5e0; padding: .6rem 0; }
  a:focus-visible { outline: 3px solid #0b4f8a; outline-offset: 2px; }
  .here { font-weight: 600; }
  .muted { color: #6b6b66; font-size: .85rem; }
  .err { color: #b3261e; font-weight: 600; }
  h2 { font-size: 1.05rem; margin-top: 1.4rem; }
  .role { font-size: .75rem; font-weight: 600; padding: .05em .45em; border-radius: .35em; background: #e5e5e0; }
</style>
</head>
<body>
<main>
  <h1>🦀 gasclaw · panels</h1>
  <p id="msg" role="status" aria-live="polite">Loading…</p>
  <!-- role="list": o WebKit descarta a semântica de lista quando list-style some, e aqui a contagem é o conteúdo -->
  <ul id="panels" role="list"></ul>
  <h2 id="enginesTitle" hidden>Engine serving this agent</h2>
  <p class="muted" id="enginesNote" hidden>The engine that answers for this agent, and the address of its panel.</p>
  <ul id="engines" role="list"></ul>
  <p class="muted">Environments are isolated: this hub only keeps the path from one to the other — no data crosses over.</p>
</main>
<script>
// Nada aqui entra como HTML: só textContent e href montado a partir da URL que o servidor embutiu no build.
const $ = (id) => document.getElementById(id);

function render(s) {
  // Você está no hub, não num painel: dizer "você está no painel de X" seria mentira justo na tela
  // que existe para não confundir os ambientes. (Comentário em pt-BR de propósito: é documentação interna.)
  $('msg').className = '';
  $('msg').textContent = 'Hub for the ' + s.env + ' environment.';
  $('panels').replaceChildren(...s.panels.map((p) => {
    const li = document.createElement('li');
    // todo painel é um link, inclusive o do ambiente atual: quem favorita o hub precisa de caminho para os dois
    const a = document.createElement('a');
    a.href = p.url;
    a.target = '_top';
    a.textContent = 'Open the ' + p.env + ' panel';
    li.append(a);
    if (p.current) {
      const here = document.createElement('span');
      here.className = 'here';
      here.textContent = ' · this is the environment this hub lives in';
      li.append(here);
    }
    return li;
  }));
  // O MOTOR que serve este agente. Só textContent e href — o nome do agente vem de uma Property e
  // não pode virar marcação.
  const engines = s.engines || [];
  $('enginesTitle').hidden = $('enginesNote').hidden = engines.length === 0;
  $('engines').replaceChildren(...engines.map((e) => {
    const li = document.createElement('li');
    const tag = document.createElement('span');
    tag.className = 'role ' + e.role;
    tag.textContent = e.role;
    li.append(tag, document.createTextNode(' ' + e.agent + ' · engine ' + e.engine + ' '));
    if (e.url) {
      const a = document.createElement('a');
      a.href = e.url;
      a.target = '_top';
      a.textContent = e.current ? 'this panel' : 'open';
      li.append(a);
    } else {
      const no = document.createElement('span');
      no.className = 'muted';
      no.textContent = '(no address known)';
      li.append(no);
    }
    if (e.current) {
      const here = document.createElement('span');
      here.className = 'here';
      here.textContent = ' · you are here';
      li.append(here);
    }
    return li;
  }));
}

google.script.run
  .withSuccessHandler(render)
  .withFailureHandler((e) => { $('msg').className = 'err'; $('msg').textContent = e.message; })
  .panelsState();
</script>
</body>
</html>
