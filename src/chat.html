<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; background: #f7f7f5; color: #1d1d1b; }
  main { max-width: 42rem; margin: 0 auto; padding: 1rem; }
  #log { min-height: 50vh; max-height: 70vh; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: .75rem; }
  #log p { margin: .4rem 0; white-space: pre-wrap; }
  .eu { color: #0b4f8a; }
  .andamento { color: #6b6b66; font-style: italic; }
  .meta { color: #6b6b66; font-size: .8rem; margin-top: .15rem; }
  form { display: flex; gap: .5rem; margin-top: .75rem; }
  input { flex: 1; min-width: 0; padding: .5rem; font: inherit; }
  button { padding: .45rem .9rem; font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid #0b4f8a; outline-offset: 1px; }
  .sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <h1>Chat with your agent</h1>
  <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
  <form id="form">
    <label for="texto" class="sr">Message</label>
    <input id="texto" autocomplete="off" placeholder="Type a message" required>
    <button type="submit" id="enviar">Send</button>
  </form>
  <p class="meta">Long tasks keep running on their own, even if you close this tab: come back later and the answer will be here.</p>
</main>
<script>
// Tudo que vem do modelo entra por textContent: nada é interpretado como HTML ou código (ADR-002).
const $ = (id) => document.getElementById(id);
const log = $('log');
const call = (fn, ...a) => new Promise((ok, ko) => google.script.run.withSuccessHandler(ok).withFailureHandler(ko)[fn](...a));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const POLL_MS = 2000;
const POLL_MAX = 300; // 10 min de acompanhamento; depois disso a tarefa segue no servidor, só paramos de olhar

function add(cls, text) {
  const p = document.createElement('p');
  p.className = cls;
  p.textContent = text;
  log.append(p);
  log.scrollTop = log.scrollHeight;
  return p;
}

/** Desenha o desfecho de um run: texto, custo e, se ele parou esperando você, os botões. */
function render(p, r, runId) {
  p.className = 'agente';
  p.textContent = 'Agent: ' + (r.text || '');
  if (r.spent && r.spent !== 'US$ 0.00') {
    const m = document.createElement('span');
    m.className = 'meta';
    m.textContent = '  · ' + r.spent;
    p.append(m);
  }
  for (const c of r.choices || []) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = c.label;
    btn.onclick = async () => {
      p.querySelectorAll('button').forEach((x) => { x.disabled = true; });
      const params = {};
      params[c.key] = c.value;
      if (r.approvalToken) params.token = r.approvalToken;
      const next = add('andamento', 'Agent: working…');
      await acompanhar(next, await call('runDecide', runId, params).catch(erro), runId);
    };
    p.append(' ', btn);
  }
  log.scrollTop = log.scrollHeight;
}

const erro = (e) => ({ ok: false, error: (e && e.message) || String(e) });

/** Acompanha um run até ele terminar, falhar ou parar esperando você. */
async function acompanhar(p, r, runId, knownApprovalToken) {
  if (!r || r.ok === false) { p.className = 'agente'; p.textContent = 'Agent: ' + (r && r.error ? r.error : "I couldn't answer"); return; }
  const id = r.runId || runId;
  let approvalToken = r.approvalToken || knownApprovalToken || '';
  for (let i = 0; i < POLL_MAX; i++) {
    if (r.approvalToken) approvalToken = r.approvalToken;
    if (r.status === 'done' || r.status === 'failed' || r.waiting) return render(p, { ...r, ...(approvalToken ? { approvalToken } : {}) }, id);
    p.textContent = 'Agent: working…' + (r.spent && r.spent !== 'US$ 0.00' ? ' (' + r.spent + ')' : '');
    await sleep(POLL_MS);
    r = await call('runState', id, approvalToken).catch(erro);
    if (!r || r.ok === false) { p.className = 'agente'; p.textContent = 'Agent: ' + (r && r.error ? r.error : 'I lost contact with the task'); return; }
  }
  p.className = 'agente';
  p.textContent = 'Agent: the task is still running on the server. Reload this page in a moment to see the result.';
}

$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $('texto').value.trim();
  if (!text) return;
  $('texto').value = '';
  $('enviar').disabled = true;
  add('eu', 'You: ' + text);
  const p = add('andamento', 'Agente: trabalhando…');
  await acompanhar(p, await call('runAsk', text).catch(erro));
  $('enviar').disabled = false;
  $('texto').focus();
};
</script>
</body>
</html>
